name: Fei Notes TestFlight availability

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows: ['Fei Notes Apple release', 'Fei Notes iOS TestFlight']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: feinotes-beta-availability
  cancel-in-progress: false

jobs:
  update:
    if: github.repository_owner == 'qhhonx'
    runs-on: ubuntu-latest
    environment: feinotes-testflight
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: product/quiet-sync
      - name: Restore the last generated availability snapshot
        run: python3 -B packaging/macos/website-status.py stage website
      - name: Reconcile pending builds and read Apple's public beta state
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          FEI_PUBLIC_BETA_GROUP_ID: ${{ secrets.FEI_PUBLIC_BETA_GROUP_ID }}
          FEI_EXPIRE_SUPERSEDED_BETAS: ${{ vars.FEI_EXPIRE_SUPERSEDED_BETAS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$key"
          unset ASC_PRIVATE_KEY_B64
          export ASC_KEY_PATH="$key"
          python3 -B packaging/macos/test-apple-release.py
          python3 -B packaging/macos/test-website-status.py
          python3 -B packaging/macos/apple-release.py supersede-pending --apply
          python3 -B packaging/macos/apple-release.py beta-status website/testflight-status.json
      - name: Publish a changed availability state
        id: publication
        run: python3 -B packaging/macos/website-status.py publish website/testflight-status.json
      - name: Deploy the changed public beta state
        if: steps.publication.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fei-website.yml --ref product/quiet-sync
