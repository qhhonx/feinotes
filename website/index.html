<body>
  <div class="page">
    <a class="skip" href="#main">跳到正文</a>
    <header class="top wrap">
      <a class="brand" href="index.html"><img src="assets/fei-notes.png" width="39" height="39" alt="">飞记<small>Fei Notes</small></a>
      <nav aria-label="网站导航">
        <a href="support/index.html">支持</a>
        <a href="privacy/index.html">隐私</a>
        <a href="https://github.com/qhhonx/feinotes" rel="external">GitHub</a>
        <a class="language" href="en/index.html" hreflang="en" lang="en">English</a>
      </nav>
    </header>
    <main id="main" class="wrap">
      <div class="hero">
        <p class="release"><span aria-hidden="true"></span>Mac 版 · TestFlight</p>
        <h1>写得自在，<br><span>记得安心。</span></h1>
        <p class="lead">飞书文档般顺手，iCloud 备忘录般安心。</p>
        <div id="testflight" class="beta-access" data-language="zh" data-status="testflight-status.json">
          <div class="beta-platform" data-beta-platform="MAC_OS">
            <a class="beta-download" data-beta-link aria-disabled="true" tabindex="-1" aria-live="polite">测试版准备中</a>
            <p class="beta-details beta-platform-status">Mac · macOS 14+<span data-beta-review hidden aria-live="polite"></span></p>
          </div>
          <div class="beta-mobile" data-beta-platform="IOS">
            <a class="beta-mobile-link" data-beta-link aria-disabled="true" tabindex="-1" aria-live="polite">iPhone / iPad · 测试版准备中</a>
            <span class="beta-details" data-beta-review hidden aria-live="polite"></span>
          </div>
        </div>
      </div>
      <div class="theme-switch" role="group" aria-label="查看功能">
        <button type="button" class="active" data-theme="sync" aria-pressed="true">iCloud 多端同步</button>
        <button type="button" data-theme="collab" aria-pressed="false">多人实时编辑</button>
      </div>
      <div class="scene-gallery">
      <figure class="shot story sync-story sync-preview" data-scene="sync" aria-label="同一篇海边笔记在 Mac 和 iPhone 上的飞记界面展示。">
        <div class="sync-stage">
          <div class="sync-window sync-window-primary">
            <img src="assets/sync-after-zh.webp?v=20261118f" width="1840" height="1142" alt="飞记备忘录主题实拍。「把周末留给海边」从「如果还早，」续写到「就沿着海走到天黑。」，下面是灯塔照片和黄色圆形待办。" fetchpriority="high">
            <img class="sync-before" src="assets/sync-before-zh.webp?v=20261118f" width="1840" height="1142" alt="" aria-hidden="true">
          </div>
          <div class="sync-window sync-window-secondary sync-phone">
            <div class="phone-screen"><img src="assets/sync-iphone-zh.png?v=20261118f" width="1206" height="2622" alt="iPhone 上的飞记界面。「把周末留给海边」在标题下方续写为「如果还早，就沿着海走到天黑。」">
            <span class="phone-line-mask" aria-hidden="true"></span></div>
          </div>
          <div class="sync-controls"><span class="sync-caption">备忘录主题</span><button class="sync-replay" data-animation-toggle type="button" aria-label="暂停动画">Ⅱ 暂停动画</button></div>
        </div>
      </figure>
      <figure class="shot story collab-story" data-scene="collab" hidden aria-label="多人实时编辑 · 飞书文档主题原生界面">
        <div class="collab-preview">
          <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
          <img src="assets/editor-feishu.webp?v=20261118f" width="1840" height="1142" alt="海边小书展 · 开展计划。林夏续写本周目标，陈屿同时填写表格进度。" loading="lazy">
          <div class="collab-edit collab-edit-first" aria-hidden="true"><span class="collab-remainder"></span><span class="collab-writer"></span></div>
          <div class="collab-edit collab-edit-second" aria-hidden="true"><span class="collab-remainder"></span><span class="collab-writer"></span></div>
        </div>
        <figcaption class="collab-controls"><span>飞书文档主题</span><button class="collab-toggle" data-animation-toggle type="button" aria-label="暂停动画">Ⅱ 暂停动画</button></figcaption>
      </figure>
      </div>
    </main>
    <footer class="wrap">
      <span>© 2026 飞记 · Fei Notes</span>

    </footer>
  </div>
