[package]
name = "scheduler"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
autoexamples = false
autobenches = false

[lib]
path = "src/scheduler.rs"
doctest = false

[features]
test-support = []
# Allows `spawn_dedicated` to create real threads on wasm targets by spawning
# web workers. Off by default because it requires shared-memory threading
# (atomics + bulk-memory); wasm consumers without those build flags keep
# compiling, and `spawn_dedicated` panics at runtime instead.
#
# `flume/spin` replaces flume's internal `std::sync::Mutex` with a spinlock:
# a contended `std` lock parks with `Atomics.wait`, which the browser forbids
# on the main thread, and the main thread sends on flume channels every time
# it schedules work onto a dedicated thread.
wasm-threads = ["dep:wasm_thread", "flume/spin"]

[dependencies]
async-task = "4.7"
backtrace = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "now", "wasmbind"] }
flume = { version = "0.12", default-features = false, features = ["async"] }
futures = "0.3.34"
parking_lot = "0.12.1"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
web-time = "1.1.0"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm_thread = { version = "0.3", features = ["es_modules"], optional = true }

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

declare_interior_mutable_const = "deny"

redundant_clone = "deny"
disallowed_methods = "deny"

# We currently do not restrict any style rules
# as it slows down shipping code to Zed.
#
# Running ./script/clippy can take several minutes, and so it's
# common to skip that step and let CI do it. Any unexpected failures
# (which also take minutes to discover) thus require switching back
# to an old branch, manual fixing, and re-pushing.
#
# In the future we could improve this by either making sure
# Zed can surface clippy errors in diagnostics (in addition to the
# rust-analyzer errors), or by having CI fix style nits automatically.
style = { level = "allow", priority = -1 }

# Individual rules that have violations in the codebase:
type_complexity = "allow"
let_underscore_future = "allow"

# Motivation: We use `vec![a..b]` a lot when dealing with ranges in text, so
# warning on this rule produces a lot of noise.
single_range_in_vec_init = "allow"

# in Rust it can be very tedious to reduce argument count without
# running afoul of the borrow checker.
too_many_arguments = "allow"

# We often have large enum variants yet we rarely actually bother with splitting them up.
large_enum_variant = "allow"

# Boolean expressions can be hard to read, requiring only the minimal form gets in the way
nonminimal_bool = "allow"
