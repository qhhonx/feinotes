name: Fei Notes website

on:
  push:
    branches: [gh-pages, product/quiet-sync]
    paths:
      - 'website/**'
      - '.github/workflows/fei-website.yml'
      - '*.html'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - 'en/**'
      - 'support/**'
      - 'privacy/**'
      - 'CNAME'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: feinotes-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Select website files
        id: site
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == "gh-pages" ]]; then
            site_path=.
          else
            site_path=website
          fi
          test -f "$site_path/index.html"
          test "$(cat "$site_path/CNAME")" = feinotes.app
          echo "path=$site_path" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ steps.site.outputs.path }}
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
