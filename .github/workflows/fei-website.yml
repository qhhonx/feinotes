name: Fei Notes website

on:
  push:
    branches: [gh-pages, product/quiet-sync]
    paths:
      - 'website/**'
      - '.github/workflows/fei-website.yml'
      - '*.html'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - 'en/**'
      - 'support/**'
      - 'privacy/**'
      - 'CNAME'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: feinotes-website
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Select website files
        id: site
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == "gh-pages" ]]; then
            site_path=.
          else
            site_path=website
          fi
          test -f "$site_path/index.html"
          test "$(cat "$site_path/CNAME")" = feinotes.app
          echo "path=$site_path" >> "$GITHUB_OUTPUT"
      - name: Include current generated TestFlight availability
        if: github.ref_name == 'product/quiet-sync'
        env:
          SITE_PATH: ${{ steps.site.outputs.path }}
        run: python3 -B packaging/macos/website-status.py stage "$SITE_PATH"
      - name: Archive public website including app association
        env:
          SITE_PATH: ${{ steps.site.outputs.path }}
        run: |
          tar --dereference --hard-dereference --directory "$SITE_PATH" \
            --exclude=.git --exclude=.github -cf "$RUNNER_TEMP/feinotes-pages.tar" .
          tar -tf "$RUNNER_TEMP/feinotes-pages.tar" | grep -Fx './.well-known/apple-app-site-association'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/feinotes-pages.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
