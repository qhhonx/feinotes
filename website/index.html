<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="原生 Markdown 文档应用。开启 iCloud，即可跨设备接着写，和他人实时协作。">
  <link rel="canonical" href="https://feinotes.app/">
  <title>飞记 · 写得自在，记得安心。</title>
  <link rel="icon" href="assets/fei-notes.png" type="image/png">
  <link rel="preload" as="image" href="assets/coastal-canopy-v1.jpg">
  <link rel="stylesheet" href="landing.css?v=20261120e">
  <link rel="stylesheet" href="sync-preview.css?v=20261121">
  <link rel="stylesheet" href="collab-preview.css?v=20261121">
</head>
<body>
  <div class="page">
    <a class="skip" href="#main">跳到正文</a>
    <header class="top wrap">
      <a class="brand" href="index.html"><img src="assets/fei-notes.png" width="39" height="39" alt="">飞记<small>Fei Notes</small></a>
      <nav aria-label="网站导航">
        <a href="support/index.html">支持</a>
        <a href="privacy/index.html">隐私</a>
        <a href="https://github.com/qhhonx/feinotes" rel="external">GitHub</a>
        <a class="language" href="en/index.html" hreflang="en" lang="en">English</a>
      </nav>
    </header>
    <main id="main" class="wrap">
      <div class="hero">
        <h1>写得自在，<br><span>记得安心。</span></h1>
        <div class="hero-intro">
          <p class="hero-description">支持 iCloud 的原生 Markdown 文档应用。</p>
          <p class="hero-benefits">跨设备接着写，和他人实时协作。</p>
        </div>
        <div id="testflight" class="beta-access" data-language="zh" data-status="testflight-status.json">
          <div class="beta-actions" hidden>
            <div class="beta-offer" data-beta-offer hidden>
              <a class="beta-download" data-beta-link aria-describedby="beta-version-primary"></a>
              <p class="beta-details beta-version" data-beta-version id="beta-version-primary"></p>
            </div>
            <div class="beta-offer" data-beta-offer hidden>
              <a class="beta-download" data-beta-link aria-describedby="beta-version-secondary"></a>
              <p class="beta-details beta-version" data-beta-version id="beta-version-secondary"></p>
            </div>
          </div>
          <p class="beta-details" data-beta-status role="status">正在查看测试版状态…</p>
        </div>
      </div>
      <div class="theme-switch" role="group" aria-label="查看功能">
        <button type="button" class="active" data-theme="sync" aria-pressed="true">iCloud 多端同步</button>
        <button type="button" data-theme="collab" aria-pressed="false">多人实时编辑</button>
      </div>
      <div class="scene-gallery">
      <figure class="shot story sync-story sync-preview" data-scene="sync" data-capture="still" aria-label="同一篇海边文档在 Mac 和 iPhone 上的飞记界面展示。">
        <div class="sync-stage">
          <div class="sync-window sync-window-primary">
            <img src="assets/sync-mac-140-zh.webp" width="1840" height="1150" alt="飞记在 Mac 上打开《把周末留给海边》。页面有灯塔照片和待办清单。" fetchpriority="high">
          </div>
          <div class="sync-window sync-window-secondary sync-phone">
            <div class="phone-screen"><img src="assets/sync-iphone-140-zh.webp" width="660" height="1434" alt="iPhone 上打开同一篇《把周末留给海边》。">
            </div>
          </div>
          <div class="sync-controls"><span class="sync-caption">备忘录主题</span></div>
        </div>
      </figure>
      <figure class="shot story collab-story" data-scene="collab" data-capture="still" hidden aria-label="多人实时编辑 · 飞书文档主题原生界面">
        <div class="collab-preview">
          <img src="assets/collaboration-140-zh.webp" width="1840" height="1150" alt="两人同时编辑《海边小书展》。表格里的绿色光标和标签标出了另一位协作者。" loading="lazy">
        </div>
        <figcaption class="collab-controls"><span>飞书文档主题</span></figcaption>
      </figure>
      </div>
    </main>
    <footer class="wrap">
      <span>© 2026 飞记 · Fei Notes</span>
      <div class="footer-links"><a href="https://t.me/+eKIYrdIFufxmYzJl">Telegram 反馈群 ↗</a><a href="https://github.com/s1dashu/quiet-md">基于 Quiet.md</a></div>
    </footer>
  </div>
  <script src="theme-gallery.js?v=20261121" defer></script>
  <script src="testflight.js?v=6" defer></script>
</body>
</html>
