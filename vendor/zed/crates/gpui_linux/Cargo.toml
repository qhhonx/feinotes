[package]
name = "gpui_linux"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
autoexamples = false
autobenches = false

[lib]
path = "src/gpui_linux.rs"
doctest = false

[features]
default = ["wayland", "x11"]
test-support = ["gpui/test-support"]
wayland = [
    "dep:accesskit_unix",
    "gpui_wgpu",
    "ashpd/wayland",

    "calloop-wayland-source",
    "wayland-backend",
    "wayland-client",
    "wayland-cursor",
    "wayland-protocols",
    "wayland-protocols-plasma",
    "wayland-protocols-wlr",
    "filedescriptor",
    "xkbcommon/wayland",
    "open",
    "gpui/wayland",
    "uuid/v5",
]
x11 = [
    "dep:accesskit_unix",
    "gpui_wgpu",
    "ashpd",

    "as-raw-xcb-connection",
    "x11rb",
    "xkbcommon/x11",
    "xim",
    "filedescriptor",
    "open",
    "scap?/x11",
]
screen-capture = [
    "gpui/screen-capture",
    "scap",
]


[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
accesskit = { version = "0.24.0", features = ["enumn"] }
