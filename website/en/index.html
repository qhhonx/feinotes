<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="The ease of Lark Docs. The peace of mind of Apple Notes with iCloud.">
  <link rel="canonical" href="https://feinotes.app/en/">
  <title>Fei Notes · Space to think. Peace of mind.</title>
  <link rel="icon" href="../assets/fei-notes.png" type="image/png">
  <link rel="preload" as="image" href="../assets/coastal-canopy-v1.jpg">
  <link rel="stylesheet" href="../landing.css">
  <link rel="stylesheet" href="../sync-preview.css">
  <link rel="stylesheet" href="../collab-preview.css">
</head>
<body>
  <div class="page">
    <a class="skip" href="#main">Skip to content</a>
    <header class="top wrap">
      <a class="brand" href="index.html"><img src="../assets/fei-notes.png" width="39" height="39" alt="">Fei Notes<small>飞记</small></a>
      <nav aria-label="Site navigation">
        <a href="support/index.html">Support</a>
        <a href="privacy/index.html">Privacy</a>
        <a class="language" href="../index.html" hreflang="zh-Hans" lang="zh-Hans">简体中文</a>
      </nav>
    </header>
    <main id="main" class="wrap">
      <div class="hero">
        <p class="release"><span aria-hidden="true"></span>Mac · TestFlight</p>
        <h1>Space to think.<br><span>Peace of mind.</span></h1>
        <p class="lead">The ease of Lark Docs. The peace of mind of Apple Notes with iCloud.</p>
        <div id="testflight" class="beta-access" data-language="en" data-status="../testflight-status.json">
          <a class="beta-download" data-beta-link href="https://testflight.apple.com/join/NdcXugMy" aria-disabled="true" tabindex="-1" aria-live="polite">Beta coming soon</a>
          <p class="beta-details">macOS 14 or later</p>
        </div>
      </div>
      <div class="theme-switch" role="group" aria-label="Explore features">
        <button type="button" class="active" data-theme="sync" aria-pressed="true">iCloud Sync</button>
        <button type="button" data-theme="collab" aria-pressed="false">Live Co-editing</button>
      </div>
      <figure class="shot story sync-story sync-preview" data-scene="sync" aria-label="Two real Fei Notes editor captures of the same coastal note: started in the Notes theme and continued in the Lark Docs theme.">
        <div class="sync-stage">
          <div class="sync-window sync-window-primary">
            <img src="../assets/sync-before-en.webp" width="1840" height="1142" alt="Fei Notes in the Notes theme. Below the title A weekend by the sea, the note begins “If there’s time,” above the lighthouse photo and yellow circular checkboxes." fetchpriority="high">
            <span class="scene-note" aria-hidden="true">Notes theme</span>
          </div>
          <div class="sync-window sync-window-secondary">
            <img src="../assets/sync-feishu-en.webp" width="1840" height="1142" alt="The same A weekend by the sea note in the Lark Docs theme. Below the title, the line now reads “If there’s time, follow the coast until dark.”">
            <span class="scene-note" aria-hidden="true">Lark Docs theme</span>
          </div>
        </div>
      </figure>
      <figure class="shot story collab-story" data-scene="collab" hidden aria-label="Live Co-editing · Design preview">
        <div class="collab-preview">
          <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
          <img src="../assets/editor-feishu-en.webp" width="1840" height="1142" alt="Seaside Book Fair · Opening Plan. Lynn selects text in the goal. Riley edits a status in the table." loading="lazy">
          <div class="collab-presence" aria-hidden="true">
            <div class="collab-avatars">
              <span class="collab-avatar lin">L</span>
              <span class="collab-avatar chen">R</span>
            </div>
            <span class="collab-share"><svg viewBox="0 0 16 16"><path d="M8 10V2m0 0L5 5m3-3 3 3M5 7H3v7h10V7h-2"/></svg>Share</span>
          </div>
          <span class="coedit-selection lin-mark" aria-hidden="true"></span>
          <span class="coedit-name lin-mark" aria-hidden="true">Lynn</span>
          <span class="coedit-selection chen-mark" aria-hidden="true"></span>
          <span class="coedit-name chen-mark" aria-hidden="true">Riley</span>
        </div>
        <figcaption class="scene-note">Lark Docs theme</figcaption>
      </figure>
    </main>
    <footer class="wrap">
      <span>© 2026 Fei Notes</span>
      <div class="footer-links"><a href="https://t.me/+eKIYrdIFufxmYzJl">Telegram feedback ↗</a><a href="https://github.com/s1dashu/quiet-md">Based on Quiet.md</a></div>
    </footer>
  </div>
  <script src="../theme-gallery.js" defer></script>
  <script src="../testflight.js" defer></script>
</body>
</html>
