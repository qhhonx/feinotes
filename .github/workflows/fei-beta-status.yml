name: Fei Notes TestFlight availability

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows: ['Fei Notes Apple release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: feinotes-beta-availability
  cancel-in-progress: false

jobs:
  update:
    if: github.repository_owner == 'qhhonx'
    runs-on: ubuntu-latest
    environment: feinotes-testflight
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: product/quiet-sync
      - name: Read Apple's public beta state
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          FEI_PUBLIC_BETA_GROUP_ID: ${{ vars.FEI_PUBLIC_BETA_GROUP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s' "$ASC_PRIVATE_KEY_B64" | base64 --decode > "$key"
          unset ASC_PRIVATE_KEY_B64
          export ASC_KEY_PATH="$key"
          python3 -B packaging/macos/apple-release.py beta-status website/testflight-status.json
      - name: Publish a changed availability state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add website/testflight-status.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update public TestFlight availability'
          git push origin HEAD:product/quiet-sync
          gh workflow run fei-website.yml --ref product/quiet-sync
