<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>共享邀请 · 飞记</title>
  <link rel="icon" href="/assets/fei-notes.png" type="image/png">
  <link rel="stylesheet" href="/share/invitation.css?v=2">
</head>
<body>
  <main class="invitation" aria-labelledby="invitation-title">
    <a class="invite-brand" href="/"><img src="/assets/fei-notes.png" width="32" height="32" alt=""><span data-en="Fei Notes">飞记</span></a>
    <h1 id="invitation-title" data-en="Sharing invitation">共享邀请</h1>
    <p id="invite-status" role="status" data-en="Checking the invitation…">正在检查邀请…</p>
    <div id="invite-open" class="invite-actions" hidden>
      <a id="open-app" class="invite-button invite-button-primary"><span data-en="Open in Fei Notes">用飞记打开</span></a>
      <a id="open-web" class="invite-button"><span data-en="Open on the web">在网页版打开</span><small class="invite-beta">Beta</small></a>
    </div>
    <div id="invite-options" class="invite-options" hidden>
      <a id="get-app" href="/#testflight" data-en="Get the Fei Notes app">获取飞记 App</a>
      <a href="#" id="copy-link" data-en="Copy invitation link">复制邀请链接</a>
    </div>
    <noscript>请启用 JavaScript，或将本页地址粘贴到飞记的「接受邀请」入口。</noscript>
  </main>
  <script type="module" src="/share/page.mjs?v=share8"></script>
</body>
</html>
