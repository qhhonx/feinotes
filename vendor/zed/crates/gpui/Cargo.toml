etagere = "0.2"
futures = "0.3.34"
futures-concurrency = { version = "7.7.1", optional = true }
gpui_macros = { path = "../gpui_macros" }
gpui_shared_string = { path = "../gpui_shared_string" }
http_client = { path = "../http_client" }
icu_segmenter = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
image = { version = "0.25.1", default-features = false, features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "rayon",
    "tga",
    "tiff",
    "webp",
